<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Portfolio Iswan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f19;--card:#111827;--card2:#1f2937;--acc:#0ea5e9;--acc2:#6366f1;--grad:linear-gradient(135deg,#0ea5e9,#6366f1);--txt:#f3f4f6;--muted:#9ca3af;--line:rgba(255,255,255,.09)}
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .cardx{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .muted{color:var(--muted)}
  .form-control,.form-select{background:#0d1322;border-color:var(--line);color:var(--txt)}
  .form-control:focus,.form-select:focus{background:#0d1322;color:var(--txt);border-color:var(--acc);box-shadow:0 0 0 .2rem rgba(14,165,233,.2)}
  .form-control::placeholder{color:#6b7280}
  .form-text{color:var(--muted)}
  .btn-acc{background:var(--grad);border:0;color:#fff;font-weight:600}
  .btn-acc:hover{color:#fff;filter:brightness(1.1)}
  .btn-ghost{border:1px solid var(--line);color:var(--txt);background:rgba(255,255,255,.03)}
  .btn-ghost:hover{background:rgba(255,255,255,.08);color:#fff}
  .topbar{border-bottom:1px solid var(--line);background:rgba(11,15,25,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .side .nav-link{color:var(--muted);border-radius:10px;padding:.65rem .9rem;font-weight:500;display:flex;gap:.6rem;align-items:center}
  .side .nav-link.active,.side .nav-link:hover{background:rgba(14,165,233,.12);color:var(--acc)}
  .side .nav-link i{width:18px;text-align:center}
  .item{background:#0d1322;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center}
  .item + .item{margin-top:10px}
  .item .thumb{width:64px;height:44px;border-radius:8px;object-fit:cover;background:var(--grad);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
  .item .meta{flex:1;min-width:0}
  .item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ord{display:flex;flex-direction:column;gap:2px}
  .ord button{padding:0 6px;line-height:1.2}
  .modal-content{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:16px}
  .modal-header,.modal-footer{border-color:var(--line)}
  .preview{background:#0d1322;border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
  .imgprev{max-height:160px;border-radius:10px;border:1px solid var(--line)}
  .toast-wrap{position:fixed;right:16px;bottom:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
  .toastx{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:10px;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toastx.err{border-left-color:#ef4444}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 15% 20%,rgba(14,165,233,.14),transparent 40%),radial-gradient(circle at 85% 80%,rgba(99,102,241,.14),transparent 40%)}
  .busy{position:fixed;inset:0;background:rgba(11,15,25,.55);display:none;align-items:center;justify-content:center;z-index:3000}
  .busy.on{display:flex}
  @media (max-width:991px){.side{display:flex;overflow-x:auto;gap:4px}.side .nav-link{white-space:nowrap}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap" style="display:none">
  <div class="cardx p-4 p-md-5 w-100" style="max-width:420px">
    <h1 class="h4 fw-bold mb-1"><span class="grad">Portfolio Admin</span></h1>
    <p class="muted small mb-4">Masuk untuk mengedit konten website.</p>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label small" for="email">Email</label>
        <input class="form-control" type="email" id="email" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label small" for="password">Password</label>
        <input class="form-control" type="password" id="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="text-danger small mb-3" role="alert"></div>
      <button class="btn btn-acc w-100 py-2" type="submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket me-2"></i>Masuk</button>
    </form>
    <a href="index.html" class="d-block text-center small muted mt-4 text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Kembali ke portofolio</a>
  </div>
</div>

<!-- APP -->
<div id="appView" style="display:none">
  <div class="topbar">
    <div class="container-xl d-flex align-items-center justify-content-between py-3 gap-3">
      <div class="fw-bold"><span class="grad">Portfolio Admin</span></div>
      <div class="d-flex align-items-center gap-2">
        <span class="small muted d-none d-md-inline" id="whoami"></span>
        <a href="index.html" target="_blank" rel="noopener" class="btn btn-sm btn-ghost"><i class="fa-solid fa-eye me-1"></i>Lihat website</a>
        <button class="btn btn-sm btn-ghost" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-1"></i>Keluar</button>
      </div>
    </div>
  </div>

  <div class="container-xl py-4">
    <div class="row g-4">
      <div class="col-lg-3">
        <nav class="side nav flex-lg-column" id="sideNav"></nav>
      </div>
      <div class="col-lg-9">
        <div class="cardx p-4" id="panel"></div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="editForm" novalidate>
      <div class="modal-header"><h5 class="modal-title fw-bold" id="editTitle"></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
      <div class="modal-body" id="editBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Batal</button>
        <button type="submit" class="btn btn-acc" id="saveBtn"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div class="busy" id="busy"><div class="spinner-border text-info" role="status"><span class="visually-hidden">Memuat…</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.PORTFOLIO_CONFIG;
  var db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var editModal = new bootstrap.Modal($('editModal'));

  // ---------- section definitions ----------
  var ICON_HELP = 'Class ikon Font Awesome, misalnya <code>fa-solid fa-chart-pie text-primary</code>. Cari ikon di <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" rel="noopener">fontawesome.com</a>.';
  var SECTIONS = [
    { key: 'about', label: 'About Me', icon: 'fa-solid fa-user' },
    { key: 'focus_items', label: 'What I Focus On', icon: 'fa-solid fa-bullseye', single: 'Focus',
      title: function (r) { return r.title; }, sub: function (r) { return r.description; }, iconOf: function (r) { return r.icon; },
      fields: [
        { name: 'title', label: 'Judul', required: true },
        { name: 'description', label: 'Deskripsi', type: 'textarea', rows: 3 },
        { name: 'icon', label: 'Ikon', type: 'icon', help: ICON_HELP, def: 'fa-solid fa-star text-info' }
      ] },
    { key: 'projects', label: 'Projects', icon: 'fa-solid fa-folder-open', single: 'Project',
      title: function (r) { return r.title; }, sub: function (r) { return [r.tag, r.period].filter(Boolean).join(' · '); }, imageOf: function (r) { return r.image_url; },
      fields: [
        { name: 'image_url', label: 'Gambar', type: 'image', help: 'JPG/PNG/WebP. Gambar otomatis diperkecil (maks. lebar 1600 px) sebelum diunggah. Pakai screenshot dengan data dummy, jangan data asli.' },
        { name: 'title', label: 'Judul', required: true },
        { name: 'description', label: 'Deskripsi singkat (tampil di kartu)', type: 'textarea', rows: 2 },
        { name: 'problem', label: 'The Problem', type: 'textarea', rows: 3 },
        { name: 'what_i_did', label: 'What I Did', type: 'textarea', rows: 5, help: 'Satu poin per baris.' },
        { name: 'tech_stack', label: 'Tech Stack', help: 'Pisahkan dengan koma, misalnya: R, Shiny, SQL, Docker' },
        { name: 'category', label: 'Kategori filter', type: 'select', options: [['data-product', 'Data Products'], ['analysis', 'Research & Stats'], ['governance', 'Governance']], half: true },
        { name: 'tag', label: 'Label kartu', placeholder: 'Data Product · Dashboard', half: true },
        { name: 'period', label: 'Tahun / periode', placeholder: '2026', half: true }
      ] },
    { key: 'skill_groups', label: 'Technical Skills', icon: 'fa-solid fa-code', single: 'Kelompok Skill',
      title: function (r) { return r.title; }, sub: function (r) { return r.items; }, iconOf: function (r) { return r.icon; },
      fields: [
        { name: 'title', label: 'Nama kelompok', required: true, placeholder: 'Programming' },
        { name: 'items', label: 'Daftar skill', type: 'textarea', rows: 3, help: 'Pisahkan dengan koma, misalnya: Python (Advanced), R, SQL' },
        { name: 'icon', label: 'Ikon', type: 'icon', help: ICON_HELP, def: 'fa-solid fa-code text-primary' }
      ] },
    { key: 'timeline', label: 'Experience & Education', icon: 'fa-solid fa-briefcase', single: 'Riwayat', groupBy: 'kind', groups: [['work', 'Work History'], ['education', 'Education']],
      title: function (r) { return r.title; }, sub: function (r) { return [r.org, r.period].filter(Boolean).join(' · '); },
      fields: [
        { name: 'kind', label: 'Jenis', type: 'select', options: [['work', 'Work History'], ['education', 'Education']], half: true },
        { name: 'period', label: 'Periode', placeholder: '2019 – Present', half: true },
        { name: 'title', label: 'Jabatan / gelar', required: true },
        { name: 'org', label: 'Instansi / kampus' },
        { name: 'badge', label: 'Badge (opsional, khusus Education)', placeholder: 'GPA 3.80 / 4.00' },
        { name: 'description', label: 'Deskripsi', type: 'textarea', rows: 4, help: 'Satu baris = paragraf. Beberapa baris = daftar poin.' }
      ] },
    { key: 'publications', label: 'Publications & Recognitions', icon: 'fa-solid fa-award', single: 'Item', groupBy: 'kind', groups: [['publication', 'Peer-Reviewed Publications'], ['recognition', 'Certifications & Honors']],
      title: function (r) { return r.title; }, sub: function (r) { return [r.year, r.venue].filter(Boolean).join(' · '); }, iconOf: function (r) { return r.icon; },
      fields: [
        { name: 'kind', label: 'Jenis', type: 'select', options: [['publication', 'Publication'], ['recognition', 'Recognition / Certification']], half: true },
        { name: 'year', label: 'Tahun', placeholder: '2022', half: true },
        { name: 'title', label: 'Judul', required: true },
        { name: 'venue', label: 'Jurnal / penyelenggara / keterangan' },
        { name: 'link', label: 'Link (opsional)', placeholder: 'https://…' },
        { name: 'icon', label: 'Ikon (untuk Recognition)', type: 'icon', help: ICON_HELP, def: 'fa-solid fa-award text-warning' }
      ] }
  ];
  var byKey = {}; SECTIONS.forEach(function (s) { byKey[s.key] = s; });
  var current = 'about', rows = [], editing = null, pendingImage = null;

  // ---------- helpers ----------
  function toast(msg, err) {
    var t = document.createElement('div'); t.className = 'toastx' + (err ? ' err' : ''); t.textContent = msg;
    $('toasts').appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 3000);
  }
  function busy(on) { $('busy').classList.toggle('on', !!on); }
  function friendly(e) {
    var m = (e && e.message) || String(e);
    if (/row-level security|violates|permission/i.test(m)) return 'Akun ini tidak punya izin untuk mengubah konten.';
    if (/Invalid login credentials/i.test(m)) return 'Email atau password salah.';
    if (/Email not confirmed/i.test(m)) return 'Email belum dikonfirmasi.';
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Tidak bisa terhubung ke server. Cek koneksi internet.';
    return m;
  }

  // ---------- auth ----------
  function showLogin() { $('appView').style.display = 'none'; $('loginView').style.display = 'flex'; }
  function showApp(user) {
    $('loginView').style.display = 'none'; $('appView').style.display = 'block';
    $('whoami').textContent = user.email; buildNav(); open(current);
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault(); $('loginErr').textContent = '';
    var email = $('email').value.trim(), pw = $('password').value;
    if (!email || !pw) { $('loginErr').textContent = 'Isi email dan password.'; return; }
    $('loginBtn').disabled = true;
    db.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      $('loginBtn').disabled = false;
      if (r.error) { $('loginErr').textContent = friendly(r.error); return; }
      showApp(r.data.user);
    });
  });
  $('logoutBtn').addEventListener('click', function () { db.auth.signOut().then(showLogin); });
  db.auth.getSession().then(function (r) { var s = r.data && r.data.session; s ? showApp(s.user) : showLogin(); });

  // ---------- nav ----------
  function buildNav() {
    $('sideNav').innerHTML = SECTIONS.map(function (s) {
      return '<a href="#" class="nav-link' + (s.key === current ? ' active' : '') + '" data-sec="' + s.key + '"><i class="' + s.icon + '"></i>' + s.label + '</a>';
    }).join('');
  }
  $('sideNav').addEventListener('click', function (e) {
    var a = e.target.closest('[data-sec]'); if (!a) return; e.preventDefault();
    current = a.dataset.sec; buildNav(); open(current);
  });

  function open(key) { key === 'about' ? openAbout() : openList(key); }

  // ---------- About ----------
  function openAbout() {
    busy(true);
    db.from('profile').select('*').eq('id', 1).maybeSingle().then(function (r) {
      busy(false);
      if (r.error) { toast(friendly(r.error), true); }
      var text = (r.data && r.data.about) || '';
      $('panel').innerHTML =
        '<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><h2 class="h5 fw-bold mb-0">About Me</h2>' +
        '<button class="btn btn-acc" id="saveAbout"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan</button></div>' +
        '<label class="form-label small" for="aboutTa">Teks About</label>' +
        '<textarea class="form-control" id="aboutTa" rows="12">' + esc(text) + '</textarea>' +
        '<div class="form-text mb-3">Pisahkan paragraf dengan satu baris kosong. Tulis <code>**teks**</code> untuk huruf tebal.</div>' +
        '<div class="small muted mb-2">Pratinjau</div><div class="preview" id="aboutPrev"></div>';
      var ta = $('aboutTa');
      function prev() {
        $('aboutPrev').innerHTML = ta.value.split(/\n\s*\n/).filter(function (p) { return p.trim(); })
          .map(function (p) { return '<p>' + esc(p.trim()).replace(/\*\*(.+?)\*\*/g, '<strong class="text-white">$1</strong>').replace(/\n/g, '<br>') + '</p>'; }).join('') || '<em>Kosong</em>';
      }
      ta.addEventListener('input', prev); prev();
      $('saveAbout').addEventListener('click', function () {
        busy(true);
        db.from('profile').upsert({ id: 1, about: ta.value, updated_at: new Date().toISOString() }).select().then(function (r) {
          busy(false);
          if (r.error || !r.data || !r.data.length) return toast(friendly(r.error || 'Tidak tersimpan. Akun ini tidak punya izin.'), true);
          toast('About Me tersimpan.');
        });
      });
    });
  }

  // ---------- generic list ----------
  function openList(key) {
    var s = byKey[key]; busy(true);
    db.from(key).select('*').order('sort_order').order('id').then(function (r) {
      busy(false);
      if (r.error) { $('panel').innerHTML = '<p class="text-danger">' + esc(friendly(r.error)) + '</p>'; return; }
      rows = r.data || [];
      var head = '<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><div><h2 class="h5 fw-bold mb-0">' + s.label + '</h2><small class="muted">' + rows.length + ' item · urutkan dengan tombol panah</small></div>' +
        '<button class="btn btn-acc" data-add><i class="fa-solid fa-plus me-2"></i>Tambah ' + s.single + '</button></div>';
      var body;
      if (s.groupBy) {
        body = s.groups.map(function (g) {
          var list = rows.filter(function (x) { return x[s.groupBy] === g[0]; });
          return '<div class="d-flex justify-content-between align-items-center mt-4 mb-2"><h3 class="h6 fw-bold mb-0 text-info">' + g[1] + '</h3>' +
            '<button class="btn btn-sm btn-ghost" data-add="' + g[0] + '"><i class="fa-solid fa-plus me-1"></i>Tambah</button></div>' + listHtml(s, list);
        }).join('');
      } else body = listHtml(s, rows);
      $('panel').innerHTML = head + body;
    });
  }
  function listHtml(s, list) {
    if (!list.length) return '<div class="preview text-center">Belum ada item.</div>';
    return list.map(function (r, i) {
      var thumb = s.imageOf
        ? (r.image_url ? '<img class="thumb" src="' + esc(r.image_url) + '" alt="">' : '<div class="thumb"><i class="fa-solid fa-image"></i></div>')
        : '<div class="thumb" style="width:44px"><i class="' + esc((s.iconOf && s.iconOf(r)) || 'fa-solid fa-circle') + '" style="color:#fff"></i></div>';
      return '<div class="item">' +
        '<div class="ord"><button class="btn btn-sm btn-ghost" data-move="-1" data-id="' + r.id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Naik"><i class="fa-solid fa-chevron-up"></i></button>' +
        '<button class="btn btn-sm btn-ghost" data-move="1" data-id="' + r.id + '"' + (i === list.length - 1 ? ' disabled' : '') + ' aria-label="Turun"><i class="fa-solid fa-chevron-down"></i></button></div>' +
        thumb + '<div class="meta"><b>' + esc(s.title(r)) + '</b><small>' + esc(s.sub(r)) + '</small></div>' +
        '<button class="btn btn-sm btn-ghost" data-edit="' + r.id + '"><i class="fa-solid fa-pen"></i><span class="d-none d-sm-inline ms-1">Edit</span></button>' +
        '<button class="btn btn-sm btn-outline-danger" data-del="' + r.id + '" aria-label="Hapus"><i class="fa-solid fa-trash"></i></button></div>';
    }).join('');
  }

  $('panel').addEventListener('click', function (e) {
    var s = byKey[current]; if (!s || current === 'about') return;
    var b;
    if ((b = e.target.closest('[data-add]'))) return openEditor(null, b.dataset.add || null);
    if ((b = e.target.closest('[data-edit]'))) return openEditor(rows.find(function (r) { return r.id == b.dataset.edit; }));
    if ((b = e.target.closest('[data-del]'))) return del(rows.find(function (r) { return r.id == b.dataset.del; }));
    if ((b = e.target.closest('[data-move]'))) return move(+b.dataset.id, +b.dataset.move);
  });

  function siblings(r) { var s = byKey[current]; return rows.filter(function (x) { return !s.groupBy || x[s.groupBy] === r[s.groupBy]; }); }
  function move(id, dir) {
    var r = rows.find(function (x) { return x.id === id; }); var list = siblings(r);
    var i = list.indexOf(r), j = i + dir; if (j < 0 || j >= list.length) return;
    list.splice(i, 1); list.splice(j, 0, r);
    busy(true);
    Promise.all(list.map(function (x, k) { return db.from(current).update({ sort_order: k + 1 }).eq('id', x.id).select('id'); })).then(function (res) {
      busy(false);
      var bad = res.find(function (x) { return x.error || !x.data || !x.data.length; });
      if (bad) toast(friendly(bad.error || 'Urutan tidak tersimpan. Akun ini tidak punya izin.'), true);
      openList(current);
    });
  }
  function del(r) {
    if (!r || !confirm('Hapus "' + byKey[current].title(r) + '"? Tindakan ini tidak bisa dibatalkan.')) return;
    busy(true);
    db.from(current).delete().eq('id', r.id).select('id').then(function (res) {
      busy(false);
      if (res.error || !res.data || !res.data.length) return toast(friendly(res.error || 'Tidak terhapus. Akun ini tidak punya izin.'), true);
      toast('Item dihapus.'); openList(current);
    });
  }

  // ---------- editor ----------
  function fieldHtml(f, v) {
    var id = 'f_' + f.name, val = v == null ? (f.def || '') : v, req = f.required ? ' required' : '';
    var lab = '<label class="form-label small" for="' + id + '">' + f.label + (f.required ? ' <span class="text-danger">*</span>' : '') + '</label>';
    var help = f.help ? '<div class="form-text">' + f.help + '</div>' : '';
    var ph = f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '';
    var input;
    if (f.type === 'textarea') input = '<textarea class="form-control" id="' + id + '" name="' + f.name + '" rows="' + (f.rows || 3) + '"' + ph + req + '>' + esc(val) + '</textarea>';
    else if (f.type === 'select') input = '<select class="form-select" id="' + id + '" name="' + f.name + '">' + f.options.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
    else if (f.type === 'icon') input = '<div class="input-group"><span class="input-group-text bg-transparent border-secondary text-white" style="width:46px;justify-content:center"><i id="iconPrev" class="' + esc(val) + '"></i></span><input class="form-control" id="' + id + '" name="' + f.name + '" value="' + esc(val) + '"' + ph + '></div>';
    else if (f.type === 'image') input =
      '<div class="d-flex flex-wrap gap-3 align-items-start"><div id="imgBox">' + (val ? '<img class="imgprev" src="' + esc(val) + '" alt="">' : '<div class="preview small" style="width:220px;text-align:center">Belum ada gambar</div>') + '</div>' +
      '<div class="d-flex flex-column gap-2"><input class="form-control form-control-sm" type="file" id="' + id + '" accept="image/png,image/jpeg,image/webp,image/gif">' +
      '<button type="button" class="btn btn-sm btn-ghost" id="imgRemove"' + (val ? '' : ' style="display:none"') + '><i class="fa-solid fa-xmark me-1"></i>Hapus gambar</button>' +
      '<input type="hidden" name="image_url" id="imgUrl" value="' + esc(val) + '"></div></div>';
    else input = '<input class="form-control" id="' + id + '" name="' + f.name + '" value="' + esc(val) + '"' + ph + req + '>';
    return '<div class="' + (f.half ? 'col-md-4' : 'col-12') + '">' + lab + input + help + '</div>';
  }

  function openEditor(r, presetGroup) {
    var s = byKey[current]; editing = r || null; pendingImage = null;
    var data = r ? Object.assign({}, r) : {};
    if (!r && presetGroup && s.groupBy) data[s.groupBy] = presetGroup;
    $('editTitle').textContent = (r ? 'Edit ' : 'Tambah ') + s.single;
    $('editBody').innerHTML = '<div class="row g-3">' + s.fields.map(function (f) { return fieldHtml(f, data[f.name]); }).join('') + '</div>';
    var ic = $('f_icon'); if (ic) ic.addEventListener('input', function () { $('iconPrev').className = ic.value; });
    var fi = $('f_image_url');
    if (fi) {
      fi.addEventListener('change', function () {
        var file = fi.files[0]; if (!file) return;
        if (!/^image\//.test(file.type)) { toast('File harus berupa gambar.', true); fi.value = ''; return; }
        pendingImage = file;
        $('imgBox').innerHTML = '<img class="imgprev" src="' + URL.createObjectURL(file) + '" alt="">';
        $('imgRemove').style.display = '';
      });
      $('imgRemove').addEventListener('click', function () {
        pendingImage = null; fi.value = ''; $('imgUrl').value = '';
        $('imgBox').innerHTML = '<div class="preview small" style="width:220px;text-align:center">Belum ada gambar</div>';
        $('imgRemove').style.display = 'none';
      });
    }
    editModal.show();
    setTimeout(function () { var first = $('editBody').querySelector('input:not([type=hidden]):not([type=file]),textarea'); if (first) first.focus(); }, 300);
  }

  // shrink image in the browser before upload
  function shrink(file) {
    return new Promise(function (resolve) {
      if (file.type === 'image/gif') return resolve({ blob: file, ext: 'gif', type: file.type });
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / w);
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { resolve(b ? { blob: b, ext: 'webp', type: 'image/webp' } : { blob: file, ext: file.name.split('.').pop(), type: file.type }); }, 'image/webp', 0.85);
      };
      img.onerror = function () { resolve({ blob: file, ext: file.name.split('.').pop(), type: file.type }); };
      img.src = URL.createObjectURL(file);
    });
  }
  function uploadImage(file) {
    return shrink(file).then(function (x) {
      var path = 'projects/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + x.ext;
      return db.storage.from(cfg.imageBucket).upload(path, x.blob, { contentType: x.type, upsert: false }).then(function (r) {
        if (r.error) throw r.error;
        return db.storage.from(cfg.imageBucket).getPublicUrl(path).data.publicUrl;
      });
    });
  }

  $('editForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = byKey[current], payload = {}, missing = [];
    s.fields.forEach(function (f) {
      if (f.type === 'image') { payload.image_url = $('imgUrl').value || null; return; }
      var el = $('editForm').querySelector('[name="' + f.name + '"]'); var v = el.value.trim();
      if (f.required && !v) missing.push(f.label);
      payload[f.name] = (f.name === 'link' && !v) ? null : v;
    });
    if (missing.length) return toast('Wajib diisi: ' + missing.join(', '), true);
    if (payload.link && !/^https?:\/\//i.test(payload.link)) return toast('Link harus diawali http:// atau https://', true);
    $('saveBtn').disabled = true; busy(true);
    var step = pendingImage ? uploadImage(pendingImage).then(function (url) { payload.image_url = url; }) : Promise.resolve();
    step.then(function () {
      if (editing) return db.from(current).update(payload).eq('id', editing.id).select();
      var sib = rows.filter(function (x) { return !s.groupBy || x[s.groupBy] === payload[s.groupBy]; });
      payload.sort_order = sib.reduce(function (m, x) { return Math.max(m, x.sort_order || 0); }, 0) + 1;
      return db.from(current).insert(payload).select();
    }).then(function (r) {
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) throw new Error('row-level security');
      editModal.hide(); toast(editing ? 'Perubahan tersimpan.' : 'Item ditambahkan.'); openList(current);
    }).catch(function (err) { toast(friendly(err), true); })
      .then(function () { $('saveBtn').disabled = false; busy(false); });
  });
})();
</script>
</body>
